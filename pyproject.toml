[project]
name = "log"
version = "0.1.0"
description = "Local-first ML training toolkit for PyTorch"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "fastapi",
    "uvicorn",
    "pydantic",
    "watchfiles",
    "matplotlib",
    "proplot",
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log", "src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/backend/tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
