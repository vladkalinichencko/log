[project]
name = "log"
version = "0.1.0"
description = "Local-first ML training toolkit for PyTorch"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "fastapi",
    "uvicorn",
    "websockets",
    "pydantic",
    "watchfiles",
    "matplotlib",
    "pywebpush",
]

[project.optional-dependencies]
dev = ["pytest", "ruff", "pyright"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/log", "src/backend"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/backend/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E9", "F", "E741"]

[tool.ruff.lint.per-file-ignores]
"src/backend/tests/*" = ["E741"]

[tool.pyright]
pythonVersion = "3.11"
typeCheckingMode = "basic"
include = ["src/log", "src/backend"]
venvPath = "."
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
